# Four agents at Online speed, domination or nothing. Same as domination-3.yaml plus a Muse Spark seat.
#
# Civ VII has no per-victory toggle — the setup config exposes no victory parameters at all
# (docs/FINDINGS.md). So "domination only" is arranged structurally: a SINGLE Antiquity Age at
# quick speed. 
# VICTORY_DOMINATION exists in every Age — so conquest is the only outcome reachable inside the
# turn budget. This is the closest the game allows to "military only".
seed: 88892384

game:
  build: "1.4.2"
  start_age: antiquity       # domination is available in every Age
  single_age: false           # one age, no transitions — the match ends in a victory
  game_speed: GAMESPEED_ONLINE   # the fastest speed the game offers: research, production and Age progress all finish sooner
  # map_size stays at the platform default: MAPSIZE_TINY is rejected on macOS with
  # "MAP SIZE UNSUPPORTED", and the refusal only appears as an in-game dialog.
  map_size: default
  # A backstop, not the expected length. The match ends at the real finish: a domination victory
  # (realistically turns 60-150 between three seats) or the Age's own progress bar filling
  # (~100-150 turns at quick speed) — the run loop detects both. 400 only matters in a total
  # stalemate; Ctrl-C loses nothing if one develops, since every turn is autosaved.
  turn_limit: 1000
  filler_ai: none            # agents only — no Firaxis AI in the mix
  crises: true
  game_modes: []
  agents_pick_leaders: true   # each agent picks its own leader from the settings before turn 1

# Hotseat, not direct: a single-player game gives exactly ONE human seat no matter how many
# slots are marked taken. Hotseat is the mode built for several humans on one machine.
control_mode: hotseat

agents:
  - slot: 0
    player_id: 0
    name: Ada
    brain: { model: z-ai/glm-5.3-flash, thinking: medium }
    budget: { actions_per_turn: 500, seconds_per_turn: 480 }
    voice: { id: XB0fDUnXU5powFXDhCwa, gender: f }   # Charlotte — sultry, scheming
  - slot: 1
    player_id: 1
    name: Bruno
    brain: { model: deepseek/deepseek-v4-flash, thinking: medium }
    budget: { actions_per_turn: 500, seconds_per_turn: 480 }
    voice: { id: zcAOhNBS3c14rBihAFp1, gender: m }   # Giovanni — Italian, boisterous
  - slot: 2
    player_id: 2
    name: Cleo
    brain: { model: openai/gpt-5.6-luna, thinking: medium }
    budget: { actions_per_turn: 500, seconds_per_turn: 480 }
    voice: { id: oWAxZDx7w5VEj9dCyTzz, gender: f }   # Grace — Southern drawl, warm
  - slot: 3
    player_id: 3
    name: Dara
    # Meta Muse Spark 1.3 via OpenRouter. Its reasoning is hidden by the provider, so this seat's
    # monologue has commands but no thinking text. `thinking` is accepted and ignored.
    brain: { model: meta/muse-spark-1.3, thinking: medium }
    budget: { actions_per_turn: 500, seconds_per_turn: 480 }
    # TODO pick a voice: copy an ElevenLabs voice id here (gender steers the narrator's pronouns).
    voice: { id: XB0fDUnXU5powFXDhCwa, gender: f }

harness:
  hud_fields: default
  autosave_every_turn: true
  memory_mode: persistent
